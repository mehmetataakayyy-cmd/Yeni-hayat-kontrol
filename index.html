<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeni Hayat — Yönetim Paneli</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1d17; --bg-soft:#132419; --surface:#1a2e22; --surface-hi:#22392a;
    --line:#2b4536; --line-soft:#203527;
    --text:#eef5ee; --muted:#8fab98; --muted-dim:#6c8778;
    --accent:#9cba6d; --accent-deep:#7a9a52; --accent-ink:#0f1d17;
    --gold:#dcac52; --gold-soft:#3a3322;
    --danger:#c97169; --danger-soft:#3a2422;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(156,186,109,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces',Georgia,serif; font-weight:600; letter-spacing:-.01em; margin:0; }
  .wrap{ max-width:920px; margin:0 auto; padding:32px 18px 90px; }

  /* ---- Header ---- */
  .header{ margin-bottom:22px; }
  .header-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(156,186,109,.18); }
  h1.title{ font-size:26px; }
